services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: changeme
    volumes:
      - chess_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess"]
      interval: 5s
      timeout: 3s
      retries: 5

  chess:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/chess
      DB_USER: chess
      DB_PASSWORD: changeme
    # ./logs is bind-mounted, so the container writes into a host directory
    # owned by whoever checked the repo out — not by the image's `chess` user.
    # Run as the host user instead, which also stops the container leaving
    # files behind that the host account cannot delete.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - ./logs:/logs
    entrypoint: ["sh", "-c", ": > /logs/chess.log && exec java -jar /app/app.jar"]
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@chessnuts.eu
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db

volumes:
  chess_data:
