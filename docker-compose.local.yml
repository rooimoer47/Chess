services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: changeme
    volumes:
      - chess_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess"]
      interval: 5s
      timeout: 3s
      retries: 5

  chess:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/chess
      DB_USER: chess
      DB_PASSWORD: changeme
      OLLAMA_BASE_URL: http://ollama:11434
    # ./logs is bind-mounted, so the container writes into a host directory
    # owned by whoever checked the repo out — not by the image's `chess` user.
    # Run as the host user instead, which also stops the container leaving
    # files behind that the host account cannot delete.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - ./logs:/logs
    entrypoint: ["sh", "-c", ": > /logs/chess.log && exec java -jar /app/app.jar"]
    depends_on:
      db:
        condition: service_healthy

  # Local LLM for game-review comments. Published on localhost so the app can
  # also be run outside Docker (./run-backend.sh). One request and one model at a time, unloaded
  # after 5 idle minutes, and capped so a runaway model can't starve Postgres.
  # The app pulls the model itself on first use (CommentaryWorker).
  ollama:
    image: ollama/ollama:0.35.1
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: 4g

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@chessnuts.eu
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db

volumes:
  chess_data:
  ollama_models:
