services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: changeme
    volumes:
      - chess_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess"]
      interval: 5s
      timeout: 3s
      retries: 5

  chess:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/chess
      DB_USER: chess
      DB_PASSWORD: changeme
    volumes:
      - ./logs:/logs
    entrypoint: ["sh", "-c", ": > /logs/chess.log && exec java -jar /app/app.jar"]
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@chess.local
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db

volumes:
  chess_data:
