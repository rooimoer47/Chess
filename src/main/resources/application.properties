server.port=8080
server.forward-headers-strategy=native

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chess}
spring.datasource.username=${DB_USER:chess}
spring.datasource.password=${DB_PASSWORD:chess}

spring.flyway.enabled=true

chess.cookie.secure=${CHESS_COOKIE_SECURE:false}

# ELO defaults and limits
chess.elo.default-elo=1000
chess.elo.min=100
chess.elo.self-report-min=400
chess.elo.self-report-max=2800
chess.elo.disconnect-grace-seconds=60

# Matchmaking ELO window tiers (wait time in seconds → ELO spread ±)
chess.matchmaking.window.tier1-seconds=10
chess.matchmaking.window.tier1-spread=100
chess.matchmaking.window.tier2-seconds=20
chess.matchmaking.window.tier2-spread=200
chess.matchmaking.window.tier3-seconds=30
chess.matchmaking.window.tier3-spread=400
# beyond tier3: any opponent accepted

# Engine analysis for game review (see docs/PHASE4_GAME_REVIEW.md)
chess.analysis.worker-enabled=${CHESS_ANALYSIS_WORKER_ENABLED:true}
chess.analysis.stockfish-path=${STOCKFISH_PATH:/usr/local/bin/stockfish}
chess.analysis.depth=16
chess.analysis.threads=1
chess.analysis.hash-mb=32
chess.analysis.niceness=10
chess.analysis.pv-plies=6
chess.analysis.max-attempts=3
chess.analysis.poll-interval=5s
chess.analysis.position-timeout=60s

# LLM comments for game reviews (step 5 of docs/PHASE4_GAME_REVIEW.md). The engine judges, the model
# only puts the engine's facts into words.
chess.commentary.enabled=${CHESS_COMMENTARY_ENABLED:true}
chess.commentary.max-comments=12
chess.commentary.poll-interval=30s
chess.commentary.retry-interval=60s
chess.commentary.pull-timeout=30m

# Which chat model writes them: ollama (local, the default) or anthropic (hosted, needs ANTHROPIC_API_KEY).
spring.ai.model.chat=${CHESS_LLM_PROVIDER:ollama}
# Embeddings come with step 6 (pgvector); until then none.
spring.ai.model.embedding=none
# Spring AI's default is 10 attempts with growing backoff; the commentary worker retries on its own.
spring.ai.retry.max-attempts=2
# Applies to every RestClient in the app, of which the LLM is the only one. On a shared CPU, loading
# the model and writing one comment can take a minute.
spring.http.clients.read-timeout=3m

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${CHESS_LLM_MODEL:qwen3.5:4b}
spring.ai.ollama.chat.temperature=0.2
spring.ai.ollama.chat.num-predict=150
# Prompts are a few hundred tokens; a smaller context than the default 4096 keeps memory down.
spring.ai.ollama.chat.num-ctx=2048
# The model would otherwise reason before answering: many more tokens for a two-sentence note.
spring.ai.ollama.chat.think=false

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.model=${CHESS_ANTHROPIC_MODEL:claude-opus-5-5}
# Thinking is always on for this model and counts towards max-tokens; it rejects temperature.
spring.ai.anthropic.chat.max-tokens=4000
