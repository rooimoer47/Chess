# Local SonarQube for ./sonar-scan.sh. Nothing here is part of the deployed
# application — it is a development tool, kept in its own compose file so
# `docker compose up` for the app never drags a 2 GB analyser along with it.
#
#   docker compose -f docker-compose.sonar.yml up -d
#
# On its own PostgreSQL rather than the embedded H2 database, which SonarQube
# ships "for tests and demos only" and cannot migrate between versions — an H2
# instance has to be thrown away to upgrade it.
services:
  sonar-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube"]
      interval: 5s
      timeout: 3s
      retries: 10

  sonarqube:
    image: sonarqube:26.8.0.126808-community
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    # Elasticsearch refuses to start under the default limit.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      sonar-db:
        condition: service_healthy

volumes:
  sonarqube_db:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
