services:
  chess:
    build: .
    restart: unless-stopped
    env_file: .env

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_data:/etc/letsencrypt:ro
    depends_on:
      - chess

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_data:/etc/letsencrypt
    profiles:
      - certbot

volumes:
  certbot_data:
