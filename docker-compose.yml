services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - chess_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chess}"]
      interval: 5s
      timeout: 3s
      retries: 5

  chess:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy

  # Local LLM for game-review comments. Not published to the host: only the
  # chess service talks to it. One request and one model at a time, unloaded
  # after 5 idle minutes, and capped so a runaway model can't starve Postgres.
  # The app pulls its models itself on first use: the chat model and a small
  # embedding model, which take turns in memory.
  ollama:
    image: ollama/ollama:0.35.1
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: 4g

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_data:/etc/letsencrypt:ro
    # nginx looks up the chess container's address once, when it starts. A deploy
    # that recreates chess can give it a new address, and nginx then answers 502
    # until it is restarted, so have Compose restart it whenever chess is replaced.
    depends_on:
      chess:
        condition: service_started
        restart: true

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_data:/etc/letsencrypt
    profiles:
      - certbot

volumes:
  chess_data:
  certbot_data:
  ollama_models:
